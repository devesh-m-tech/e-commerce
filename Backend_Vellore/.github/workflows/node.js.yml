name: Shri Deepaalaya Silks Backend CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build:

    runs-on: self-hosted

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v4
    - run: npm i
    - run: pm2 reload sds-backend || pm2 start server.js --name sds-backend
