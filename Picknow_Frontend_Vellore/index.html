<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon: replace with client-supplied SVG/PNG logo -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Shri Deepaalaya Silks — Handpicked Silk Sarees, Ethnic Wear &amp; Jewellery</title>
    <meta name="description" content="Shri Deepaalaya Silks — Your destination for timeless handpicked silk sarees, designer &amp; bridal sarees, kurtis, salwar suits, and traditional jewellery. Shop online for festive &amp; heirloom ethnic wear across India." />
    <meta name="theme-color" content="#6D1734" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shri Deepaalaya Silks — Handpicked Silk Sarees &amp; Ethnic Wear" />
    <meta property="og:description" content="Timeless elegance, woven in tradition. Shop handpicked silk sarees, festive wear and heirloom jewellery." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:url" content="https://www.shrideepaalayasilks.com" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Shri Deepaalaya Silks" />
    <meta name="twitter:description" content="Handpicked silk sarees, festive wear and heirloom jewellery." />

    <!-- Google Fonts: Playfair Display (headings) + Karla (body/nav) — preload critical weights -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Karla:wght@400;500;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data: Organisation -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ClothingStore",
        "name": "Shri Deepaalaya Silks",
        "url": "https://www.shrideepaalayasilks.com",
        "logo": "https://www.shrideepaalayasilks.com/favicon.svg",
        "description": "Shri Deepaalaya Silks offers handpicked silk sarees, designer and bridal sarees, kurtis, salwar suits and traditional jewellery, delivered across India.",
        "areaServed": "IN",
        "currenciesAccepted": "INR",
        "paymentAccepted": "Credit Card, Debit Card, UPI, Net Banking",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Customer Support",
          "areaServed": "IN",
          "availableLanguage": ["en", "ta"]
        }
      }
    </script>
  </head>
  <body>
    <style>
      @keyframes sds-pulse {
        0%   { opacity: 1; }
        50%  { opacity: 0.45; }
        100% { opacity: 1; }
      }
      #root-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background-color: #FFF9F0;
        flex-direction: column;
        gap: 16px;
      }
      #root-loader .loader-wordmark {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.5rem;
        font-weight: 700;
        color: #6D1734;
        letter-spacing: 0.04em;
        animation: sds-pulse 1.8s ease-in-out infinite;
      }
      #root-loader .loader-bar {
        width: 120px;
        height: 2px;
        background: #EDE2D2;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      #root-loader .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -50%;
        width: 50%;
        height: 100%;
        background: #C5A15A;
        animation: loader-slide 1.4s ease-in-out infinite;
      }
      @keyframes loader-slide {
        0%   { left: -50%; }
        100% { left: 150%; }
      }
    </style>
    <div id="root">
      <div id="root-loader">
        <div class="loader-wordmark">Shri Deepaalaya Silks</div>
        <div class="loader-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
